databases:
  - name: aigril-db
    databaseName: aigril
    user: aigril
    plan: starter
    region: singapore

services:
  - type: web
    name: airi-backend
    runtime: python
    plan: starter
    region: singapore
    numInstances: 1
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    # deploy-trigger: vivix-static-assets-20260430
    buildFilter:
      paths:
        - backend/**
        - requirements.txt
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/backend/data
      - key: DATABASE_URL
        fromDatabase:
          name: aigril-db
          property: connectionString
      - key: CHROMA_PERSIST_DIR
        value: /opt/render/project/src/backend/data/chroma
      - key: EDU_SESSION_COOKIE_NAME
        value: simteach_session
      - key: EDU_SESSION_TTL_DAYS
        value: "14"
      - key: EDU_TEACHER_INVITE_CODE
        generateValue: true
      - key: EDU_SEED_ADMIN
        value: "true"
      - key: EDU_ADMIN_EMAIL
        value: admin@simclass.local
      - key: EDU_ADMIN_PASSWORD
        sync: false
      - key: EDU_ADMIN_PHONE
        value: "13800000000"
      - key: EDU_ADMIN_SCHOOL_NAME
        value: 仿真人教学教室
      - key: EDU_HF_DATASET_VIEWER_URL
        value: https://datasets-server.huggingface.co
      - key: EDU_HF_QUESTION_DATASET
        value: SeaLLMs/SeaExam
      - key: EDU_HF_QUESTION_CONFIG
        value: m3exam-chinese
      - key: EDU_HF_QUESTION_SPLIT
        value: test
      - key: EDU_QUESTION_BANK_CACHE_TTL_SECONDS
        value: "900"
      - key: EDU_DEEPSEEK_API_BASE
        value: https://api.deepseek.com/v1
      - key: EDU_DEEPSEEK_API_KEY
        sync: false
      - key: EDU_DEEPSEEK_MODEL
        value: deepseek-chat
      - key: LLM_API_BASE
        value: https://ark.cn-beijing.volces.com/api/v3
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL_NAME
        value: doubao-seed-2-0-mini-260215
      - key: ELEVENLABS_API_BASE
        value: https://api.elevenlabs.io
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: ELEVENLABS_OUTPUT_FORMAT
        value: mp3_44100_128
      - key: ELEVENLABS_TIMEOUT_SECONDS
        value: "60"
      - key: APP_SESSION_COOKIE_NAME
        value: aigril_session
      - key: APP_SESSION_TTL_DAYS
        value: "30"
      - key: APP_SESSION_COOKIE_SECURE
        value: "true"
      - key: APP_SESSION_COOKIE_SAMESITE
        value: lax
      - key: APP_SESSION_COOKIE_DOMAIN
        sync: false
      - key: APP_PASSWORD_PEPPER
        generateValue: true
      - key: APP_REQUIRE_MEMBERSHIP_FOR_AI_APIS
        value: "true"
      - key: APP_ONE_TIME_MEMBERSHIP_DAYS
        value: "30"
      - key: APP_ADMIN_EMAILS
        sync: false
      - key: APP_MONTHLY_MODEL_CALL_LIMIT
        value: "300"
      - key: APP_MONTHLY_TTS_CALL_LIMIT
        value: "100"
      - key: STRIPE_API_VERSION
        value: 2026-05-27.dahlia
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PAYMENT_PRICE_ID
        sync: false
      - key: STRIPE_SUBSCRIPTION_PRICE_ID
        sync: false
      - key: STRIPE_RETURN_URL
        sync: false
      - key: STRIPE_CUSTOMER_PORTAL_RETURN_URL
        sync: false
      - key: STRIPE_AUTOMATIC_TAX_ENABLED
        value: "false"
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    disk:
      name: backend-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 5
